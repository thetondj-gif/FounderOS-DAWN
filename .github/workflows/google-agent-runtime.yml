name: Google Agent Runtime

on:
  pull_request:
    paths:
      - "services/google-agent-runtime/**"
      - ".github/workflows/google-agent-runtime.yml"
  push:
    branches:
      - main
    paths:
      - "services/google-agent-runtime/**"
      - ".github/workflows/google-agent-runtime.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/google-agent-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/google-agent-runtime/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q dawn_google_agents
