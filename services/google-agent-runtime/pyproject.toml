[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "founderos-google-agent-runtime"
version = "0.1.0"
description = "Google ADK specialist swarm federated into DAWN/FounderOS"
requires-python = ">=3.12"
dependencies = [
  "google-adk[a2a]>=2,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
dawn-google-agents = "dawn_google_agents.server:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["dawn_google_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
